# No diagnostic/downloaded credential artifacts may be served over the tunnel.
# Request query strings and Referer can carry order keys/OAuth codes. Keep paths/status only.
LogFormat "%a %l %u %t \"%m %U %H\" %>s %O" combined
LogFormat "%v:%p %a %l %u %t \"%m %U %H\" %>s %O" vhost_combined
<FilesMatch "(?i)^(?:\..*|.*\.(?:log|sql|sql\.gz|env|ini|bak))$">
    Require all denied
</FilesMatch>
<Directory /var/www/html/wp-content/uploads/wc-logs>
    Require all denied
</Directory>
<Directory /var/www/html/wp-content/plugins/woocommerce-mercadopago/logs>
    Require all denied
</Directory>
